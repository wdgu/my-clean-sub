name: Clean Clash Sub
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  contents: write

jobs:
  run_clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pyyaml

      - name: Download source clash.yaml
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 180             -o source.yaml             "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/clash.yaml"
          test -s source.yaml
          python3 - <<'PY'
          import re
          import yaml
          CONTROL_PATTERN = re.compile(r"[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]")
          with open("source.yaml", "rb") as f:
              text = f.read().decode("utf-8", errors="replace")
          text = CONTROL_PATTERN.sub("", text)
          data = yaml.safe_load(text)
          if not isinstance(data, dict) or not isinstance(data.get("proxies"), list):
              raise SystemExit("source.yaml is not a valid Clash YAML with a proxies list")
          print(f"Downloaded source proxies: {len(data['proxies'])}")
          PY

      - name: Run rebuilt cleaner
        run: |
          set -euo pipefail
          python3 clean.py
          test -s clash_fixed.yaml

      - name: Download pinned Mihomo validator
        run: |
          set -euo pipefail
          MIHOMO_VERSION="v1.19.31"
          MIHOMO_FILE="mihomo-linux-amd64-v1-${MIHOMO_VERSION}.gz"
          MIHOMO_SHA256="d4304c546c3cddcb6fafd4b4fddb0ba1a95ffa36606fda56d75db2e59ad24114"
          curl -fL --retry 4 --retry-delay 3 --connect-timeout 15 --max-time 180             -o mihomo.gz             "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_FILE}"
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
          ./mihomo -v

      - name: Validate with Mihomo core
        run: |
          set -euo pipefail
          python3 validate_mihomo.py clash_fixed.yaml ./mihomo
          test -s clash_fixed.yaml

      - name: Final structural validation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import yaml
          CONTROL_PATTERN = re.compile(r"[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]")
          with open("clash_fixed.yaml", "rb") as f:
              text = f.read().decode("utf-8", errors="replace")
          if CONTROL_PATTERN.search(text):
              raise SystemExit("output contains forbidden YAML control characters")
          data = yaml.safe_load(text)
          proxies = data.get("proxies") if isinstance(data, dict) else None
          if not isinstance(proxies, list) or not proxies:
              raise SystemExit("clash_fixed.yaml has no valid proxies")
          names = set()
          for i, proxy in enumerate(proxies, 1):
              if not isinstance(proxy, dict):
                  raise SystemExit(f"proxy {i} is not a mapping")
              name = proxy.get("name")
              if not isinstance(name, str) or not name:
                  raise SystemExit(f"proxy {i} has no name")
              if name in names:
                  raise SystemExit(f"duplicate proxy name: {name}")
              names.add(name)
          print(f"Final proxies: {len(proxies)}")
          print(f"Final proxy groups: {len(data.get('proxy-groups', []))}")
          print(f"Final rules: {len(data.get('rules', []))}")
          PY

      - name: Commit & push cleaned file
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash_fixed.yaml clean_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "auto update cleaned sub"
            git push
          fi
